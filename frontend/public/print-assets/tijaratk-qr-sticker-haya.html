      @page {
        size: 206mm 306mm;
        margin: 0;
      }

      :root {
        color-scheme: only light;
        --brand-green: #27ae60;
        --brand-green-dark: #0f5a3d;
        --brand-green-deep: #0b4a32;
        --paper: #f7f8f6;
      }

      @font-face {
        font-family: "IBM Plex Sans Arabic";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/_next/static/media/c9a0d344f313d307-s.p.2e3b0be0.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "IBM Plex Sans Arabic";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/_next/static/media/5ad8fdb5805e9b4a-s.p.a7af9cce.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "IBM Plex Sans Arabic Fallback";
        src: local(Arial);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 206mm;
        height: 306mm;
        margin: 0;
        padding: 0;
        background: var(--brand-green);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        font-family:
          "IBM Plex Sans Arabic", "IBM Plex Sans Arabic Fallback", "Poppins",
          Arial, sans-serif;
        color: var(--brand-green-dark);
      }

      .sheet {
        position: relative;
        width: 206mm;
        height: 306mm;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 12%,
            rgba(255, 255, 255, 0.11),
            transparent 30%
          ),
          linear-gradient(180deg, #27ae60 0%, #24a457 100%);
      }

      .bleed-note {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 9mm;
        border-radius: 14mm;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.99),
          rgba(247, 248, 246, 0.99)
        );
        box-shadow: 0 5mm 14mm rgba(11, 74, 50, 0.16);
        overflow: hidden;
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(39, 174, 96, 0.12),
            transparent 36%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.94),
            rgba(255, 255, 255, 0.98)
          );
        pointer-events: none;
      }

      .content {
        position: relative;
        background: #fefdfe;
        z-index: 1;
        height: 100%;
        padding: 15mm 14mm 11mm;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        width: 120mm;
        max-width: 100%;
        height: auto;
        display: block;
        margin-top: 2mm;
        margin-bottom: 15mm;
        user-select: none;
        border-radius: 10mm;
      }

      .divider {
        width: 94mm;
        height: 1mm;
        margin: 10mm 0 7mm;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(39, 174, 96, 0.88),
          transparent
        );
      }

      .qr-card {
        width: 114mm;
        border-radius: 10mm;
        background: #ffffff;
        border: 0.8mm solid rgba(15, 90, 61, 0.12);
        box-shadow: 0 2mm 7mm rgba(11, 74, 50, 0.08);
        padding: 7mm 7mm 6mm;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .qr {
        width: 92mm;
        height: 92mm;
        position: relative;
        display: block;
      }

      .copy {
        width: 174mm;
        margin-top: 10mm;
        margin-bottom: 2mm;
        color: var(--brand-green-deep);
        text-align: center;
        line-height: 1.4;
        font-size: 24pt;
        font-weight: 700;
        letter-spacing: 0;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        text-wrap: balance;
      }

      .store-container {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        background-color: var(--brand-green-deep);
        padding: 5mm 16mm;
        border-radius: 8mm;
        margin-top: 4mm;
        text-align: center;
        min-width: 120mm;
        max-width: 170mm;
        box-shadow: 0 3mm 8mm rgba(11, 74, 50, 0.15);
      }

      .store-name {
        font-family: "IBM Plex Sans Arabic", sans-serif;
        font-size: 34pt;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        line-height: 1.2;
        text-wrap: balance;
      }

      .footer {
        margin-top: auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5mm;
      }

      .website-url {
        font-family: "Poppins", sans-serif;
        font-size: 18pt;
        font-weight: 700;
        color: var(--brand-green-deep);
        letter-spacing: 0.5px;
        background: rgba(39, 174, 96, 0.08);
        border: 0.5mm solid rgba(39, 174, 96, 0.18);
        padding: 3mm 9mm;
        border-radius: 6mm;
        text-align: center;
        box-shadow: 0 1.5mm 4mm rgba(39, 174, 96, 0.04);
      }

      .footer-line {
        width: 78mm;
        height: 0.8mm;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(39, 174, 96, 0.5),
          transparent
        );
      }

      @media screen {
        body {
          display: grid;
          place-items: center;
          min-height: 100vh;
        }

        .sheet {
          box-shadow: 0 24px 64px rgba(11, 74, 50, 0.18);
        }
      }

      @media print {
        body {
          display: block;
          min-height: auto;
        }

        .sheet,
        .frame,
        .qr-card,
        .store-container {
          box-shadow: none !important;
        }
      }
    </style>
