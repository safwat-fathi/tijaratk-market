        border-radius: 14mm;
        background: linear-gradient(

          rgba(255, 255, 255, 0.99),
          rgba(247, 248, 246, 0.99)

        overflow: hidden;

        inset: 0;
        background:

            circle at 50% 0%,
            rgba(39, 174, 96, 0.12),
            transparent 36%

            rgba(255, 255, 255, 0.98)
          );

        height: auto;
        display: block;
        margin-top: 2mm;
        margin-bottom: 15mm;
        user-select: none;
        border-radius: 10mm;
      }

        width: 94mm;
        height: 1mm;
        margin: 10mm 0 7mm;

        background: linear-gradient(

          transparent,
          rgba(39, 174, 96, 0.88),
          transparent
        );
      }

      .qr-card {
        width: 114mm;
        border-radius: 10mm;
        background: #ffffff;
        border: 0.8mm solid rgba(15, 90, 61, 0.12);
        box-shadow: 0 2mm 7mm rgba(11, 74, 50, 0.08);
        padding: 7mm 7mm 6mm;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .qr {
        width: 92mm;
        height: 92mm;
        position: relative;
        display: block;
      }

        width: 174mm;
        margin-top: 10mm;
        margin-bottom: 2mm;
        color: var(--brand-green-deep);
        text-align: center;
        line-height: 1.4;
        font-size: 24pt;
        font-weight: 700;
        letter-spacing: 0;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        text-wrap: balance;
      }

      .store-container {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        background-color: var(--brand-green-deep);
        padding: 5mm 16mm;
        border-radius: 8mm;
        margin-top: 4mm;
        text-align: center;
        min-width: 120mm;
        max-width: 170mm;
        box-shadow: 0 3mm 8mm rgba(11, 74, 50, 0.15);

        font-size: 34pt;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        line-height: 1.2;
        text-wrap: balance;
      }

        width: 100%;

        flex-direction: column;
        align-items: center;
        gap: 5mm;
      }

        font-family: "Poppins", sans-serif;
        font-size: 18pt;
        font-weight: 700;
        color: var(--brand-green-deep);
        letter-spacing: 0.5px;

        padding: 3mm 9mm;
        border-radius: 6mm;
        text-align: center;
        box-shadow: 0 1.5mm 4mm rgba(39, 174, 96, 0.04);

      .footer-line {
        width: 78mm;
        height: 0.8mm;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(39, 174, 96, 0.5),
          transparent
        );
      }

      @media screen {
        body {
          display: grid;
          place-items: center;
          min-height: 100vh;
        }

          box-shadow: 0 24px 64px rgba(11, 74, 50, 0.18);

        body {

          min-height: auto;
        }

        .sheet,
        .frame,
        .qr-card,
        .store-container {
          box-shadow: none !important;
        }
      }
